# Generation settings — tune these to change Grim's personality

# How creative/random the responses are
# 0.0 = robotic and deterministic
# 1.0 = creative but sometimes rambling
# 0.7 = sweet spot for Grim (confident but not boring)
temperature: 0.7

# Top-p sampling — controls vocabulary diversity
# 0.9 means: only consider the top 90% probability tokens
top_p: 0.9

# Max tokens to generate per response
max_tokens: 800

# Repetition penalty — stops the model looping on itself
repetition_penalty: 1.1

# Stop tokens — model stops generating when it hits these
stop_tokens:
  - "<|end|>"
  - "<|user|>"
  - "<|system|>"
