# Model
model: meta-llama/Llama-3.2-3B-Instruct

# LoRA settings (this is what makes training fast on your MacBook)
# Instead of training all 3 billion parameters, we only train ~10 million
lora_layers: 16          # how many layers to apply LoRA to
lora_rank: 8             # size of the low-rank matrices (higher = more capacity, more VRAM)
lora_alpha: 16           # scaling factor — usually 2x rank
lora_dropout: 0.05       # regularization to prevent overfitting

# Training
batch_size: 2            # how many examples processed at once (keep at 2 for M1)
learning_rate: 0.0002    # how fast the model learns (2e-4)
num_epochs: 3            # full passes through the dataset
max_seq_length: 512      # max tokens per example
warmup_steps: 10         # gradually increase lr at the start
grad_checkpoint: true    # saves memory by recomputing activations

# Saving
save_every: 100          # save a checkpoint every N steps
log_every: 10            # print loss every N steps

# Weights and Biases (set to false if you skipped wandb login)
use_wandb: false
wandb_project: grimai
